[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-visual-studio"
version = "0.1.0"
description = "Constrained e-commerce visual asset generation service (hexagonal, offline, mock-default)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.24",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["visual_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
